name: Build APK from Zip

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract ZIP File
      run: |
        unzip -q -o "*.zip" -d extracted_app
        if [ $(ls -1 extracted_app | wc -l) -eq 1 ] && [ -d "extracted_app/$(ls -1 extracted_app)" ]; then
          SUBDIR=$(ls -1 extracted_app)
          mv extracted_app/$SUBDIR/* . || true
          mv extracted_app/$SUBDIR/.* . || true
        else
          mv extracted_app/* . || true
          mv extracted_app/.* . || true
        fi
        rm -rf extracted_app

    - name: Make Gradle executable
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SpendCal-APK
        path: "**/build/outputs/apk/debug/*.apk"
